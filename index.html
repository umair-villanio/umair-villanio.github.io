<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qur'anic Words Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ea;--card:#fffdf8;--ink:#1f2933;--mute:#6b7280;--line:#e6dfcc;--pri:#1b7a78;--pri2:#e3f2f1;--gold:#b08d3c;--ok:#2f855a;--okbg:#e3f5ea;--bad:#c0392b;--badbg:#fbe7e4;--shadow:0 2px 10px rgba(60,50,20,.08);--ar:'Amiri','Scheherazade New','Traditional Arabic','Noto Naskh Arabic',serif;--arsize:1}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121816;--card:#1a2321;--ink:#e8ece9;--mute:#9aa7a2;--line:#2b3834;--pri:#4fbdb8;--pri2:#173331;--gold:#d4b25f;--ok:#6fd49b;--okbg:#17332486;--bad:#ff8f84;--badbg:#3a1f1c;--shadow:none}}
:root[data-theme=dark]{--bg:#121816;--card:#1a2321;--ink:#e8ece9;--mute:#9aa7a2;--line:#2b3834;--pri:#4fbdb8;--pri2:#173331;--gold:#d4b25f;--ok:#6fd49b;--okbg:#173324;--bad:#ff8f84;--badbg:#3a1f1c;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;line-height:1.7}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar{max-width:1000px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .ar{font-size:22px;color:var(--gold)}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--mute);font-weight:600;white-space:nowrap}
nav button.on{background:var(--pri2);color:var(--pri)}
nav button:hover{color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:16px}
h1,h2,h3{margin:.2em 0 .5em}
h2{font-size:20px}h3{font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:5px 10px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute)}.small{font-size:13px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;color:var(--mute)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
input[type=text],input[type=search],input[type=number],select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input[type=range]{width:100%;accent-color:var(--pri)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:10px 0 4px}
.stat{text-align:center}.stat b{display:block;font-size:26px;color:var(--pri)}.stat span{font-size:13px;color:var(--mute)}
.bar2{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar2>i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
/* flashcard */
.fc{margin:10px auto;max-width:640px}
.fc-in{cursor:pointer}
.face{position:relative;min-height:340px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 20px 52px;text-align:center;animation:pop .25s}
.face.back{display:none}
.fc.flip .face:not(.back){display:none}
.fc.flip .face.back{display:flex}
@keyframes pop{from{opacity:.2;transform:scale(.98)}to{opacity:1;transform:none}}
.big-ar{font-size:calc(54px*var(--arsize));line-height:1.5}
.big-en{font-size:28px;font-weight:600}
.tag{font-size:12px;color:var(--mute);position:absolute;top:12px;left:16px}
.tagr{font-size:12px;color:var(--gold);position:absolute;top:12px;right:16px}
.forms{border-collapse:collapse;margin-top:10px;width:100%;max-width:520px}
.forms td{border-top:1px solid var(--line);padding:5px 8px}
.forms td:first-child{color:var(--mute);font-size:13px;text-align:left;white-space:nowrap}
.forms td.ar{font-size:calc(26px*var(--arsize));text-align:right}
.rate{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.rate .btn{min-width:110px}
/* lists */
.sec-h{font-weight:700;display:flex;gap:8px;align-items:center;cursor:pointer;padding:10px 4px;list-style:none}
.sec-h::-webkit-details-marker{display:none}
.item{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--pri2)}
.item .ar{font-size:calc(24px*var(--arsize));text-align:right}
.star{background:none;border:0;font-size:18px;color:var(--line);padding:0}
.star.on{color:var(--gold)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dot.k{background:var(--ok)}.dot.l{background:var(--gold)}
/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:18px}
.opt.ar{text-align:center;font-size:calc(30px*var(--arsize))}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.q-ar{font-size:calc(64px*var(--arsize));text-align:center;margin:8px 0}
.q-en{font-size:28px;text-align:center;font-weight:600;margin:14px 0}
.ring{--p:0;width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:auto}
.ring>div{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:700;font-size:22px}
.ring small{display:block;font-size:11px;color:var(--mute);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{min-height:70px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px;display:grid;place-items:center;text-align:center}
.tile.ar{font-size:calc(26px*var(--arsize))}
.tile.sel{border-color:var(--pri);background:var(--pri2)}
.tile.done{visibility:hidden}
.tile.no{border-color:var(--bad);background:var(--badbg)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);max-width:560px;width:calc(100% - 28px);padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.bookimg{max-width:100%;border:1px solid var(--line);border-radius:10px;display:block;margin:0 auto;box-shadow:var(--shadow)}
details.scope summary{cursor:pointer;color:var(--pri);font-weight:600;margin-top:8px}
.secs{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:6px}
.secs label{display:flex;gap:8px;padding:3px 0;font-size:14px}
@media(max-width:640px){.brand span{display:none}main{padding:12px}.big-ar{font-size:calc(44px*var(--arsize))}}
</style>
</head>

/* ---------- storage ---------- */
const KEY='qwords.v1';
let S={known:{},star:{},srs:{},hist:[],edits:{},custom:[],cfg:{theme:'auto',arsize:1,dir:'mix',goal:10},day:{d:'',n:0},streak:{last:'',n:0},best:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
S.cfg=Object.assign({theme:'auto',arsize:1,dir:'mix',goal:10},S.cfg);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>new Date().toISOString().slice(0,10);
const DAY=864e5, IV=[0,1,2,4,8,16,32];
const CUSTOM_SEC=DB.secs.length;
const secs=DB.secs.concat([{id:CUSTOM_SEC,t:'My own cards',p:0,g:'My cards'}]);
function allCards(){
  const base=DB.cards.map(c=>{const e=S.edits[c.id];return e?Object.assign({},c,e):c});
  return base.concat(S.custom.map(c=>Object.assign({k:'w',n:0,w:0,s:CUSTOM_SEC,p:0},c)));
}
let CARDS=allCards(); const rebuild=()=>{CARDS=allCards()};
const byId=id=>CARDS.find(c=>c.id===id);
const forms=c=>c.ar.split('~');
const arMain=c=>c.k==='w'?c.ar:forms(c)[0];
const arFull=c=>c.k==='w'?c.ar:forms(c).join('  •  ');
const FL={v:['Past','Present','Command','Doer','Noun'],c:['Past','Present']};
function formsHTML(c){
  if(c.k==='w')return `<div class="ar" style="font-size:calc(40px*var(--arsize))">${esc(c.ar)}</div>`;
  const f=forms(c),L=FL[c.k]||[];
  return `<table class="forms">${f.map((x,i)=>`<tr><td>${L[i]||''}</td><td class="ar">${esc(x)}</td></tr>`).join('')}</table>`;
}
const isKnown=id=>!!S.known[id]||(S.srs[id]&&S.srs[id].box>=3);
const isDue=id=>S.srs[id]&&S.srs[id].due<=Date.now();
const grpOf=c=>secs[c.s].g;
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function touchDay(){const t=today();if(S.day.d!==t)S.day={d:t,n:0};S.day.n++;
  if(S.streak.last!==t){const y=new Date(Date.now()-DAY).toISOString().slice(0,10);S.streak.n=S.streak.last===y?S.streak.n+1:1;S.streak.last=t}}
function rate(id,q){ // q:0 again,1 good,2 easy
  const r=S.srs[id]||(S.srs[id]={box:0,due:0,wrong:0,seen:0});r.seen++;
  if(q===0){r.box=0;r.wrong++;r.due=Date.now()+6e5}
  else{r.box=Math.min(6,r.box+(q===2?2:1));r.due=Date.now()+IV[r.box]*DAY;if(r.box>=3)delete S.known[id]}
  touchDay();save();
}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:99;font-weight:600';document.body.append(t);setTimeout(()=>t.remove(),1800)}
/* ---------- stats ---------- */
const TOTAL_Q=77800;
function stats(){
  let known=0,learning=0,w=0,due=0,fresh=0;
  for(const c of CARDS){const k=isKnown(c.id);if(k){known++;w+=c.w||0}else if(S.srs[c.id])learning++;else fresh++;if(isDue(c.id))due++}
  return{known,learning,fresh,w,due,total:CARDS.length,pct:w/TOTAL_Q*100};
}
/* ---------- router ---------- */
const TABS=[['home','Home'],['browse','Browse'],['cards','Cards'],['exam','Exam'],['match','Match'],['book','Book']];
let tab='home';
function go(t){tab=t;location.hash=t;render()}

function render(){
  const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))tab=h;
  drawNav();cleanup();({home,browse,cards,exam,match,book})[tab]();window.scrollTo(0,0);
}
let cleanup=()=>{}; const setClean=f=>{cleanup=f};
document.addEventListener('keydown',e=>{if(kbd)kbd(e)}); let kbd=null;

/* ---------- scope picker ---------- */
const SC={};
function scopeUI(id,opts={}){
  const st=SC[id]||(SC[id]={g:new Set(),s:new Set(),f:opts.f||'all'});
  const groups=['Particles & Pronouns','Nouns & Attributes','Verbs','Verb Grammar'].concat(S.custom.length?['My cards']:[]);
  return `<div id="sc-${id}">
   <label class="f">What to include</label>
   <div class="row" style="gap:6px">${groups.map(g=>`<button class="chip ${st.g.has(g)?'on':''}" data-g="${esc(g)}">${g}</button>`).join('')}
     <button class="chip ${!st.g.size&&!st.s.size?'on':''}" data-all="1">Everything</button></div>
   <details class="scope" ${st.s.size?'open':''}><summary>Pick specific lists (${st.s.size||'all'})</summary>
     <div class="secs">${secs.filter(s=>s.g!=='My cards'||S.custom.length).map(s=>`<label><input type="checkbox" data-s="${s.id}" ${st.s.has(s.id)?'checked':''}> ${esc(s.t)} <span class="mute small">${s.p?'p.'+s.p:''}</span></label>`).join('')}</div></details>
   <label class="f">Which cards</label>
   <select data-f>${[['all','All cards'],['due','Due for review'],['new','New (never studied)'],['unknown','Not yet known'],['weak','Weak (I got these wrong)'],['star','Starred ★'],['known','Already known']].map(([v,l])=>`<option value="${v}" ${st.f===v?'selected':''}>${l}</option>`).join('')}</select>
  </div>`;
}
function bindScope(id,after){
  const root=$('#sc-'+id),st=SC[id];
  $$('[data-g]',root).forEach(b=>b.onclick=()=>{st.g.has(b.dataset.g)?st.g.delete(b.dataset.g):st.g.add(b.dataset.g);rerenderScope()});
  $$('[data-all]',root).forEach(b=>b.onclick=()=>{st.g.clear();st.s.clear();rerenderScope()});
  $$('[data-s]',root).forEach(b=>b.onchange=()=>{const n=+b.dataset.s;b.checked?st.s.add(n):st.s.delete(n);$('summary',root).textContent=`Pick specific lists (${st.s.size||'all'})`;after&&after()});
  $('[data-f]',root).onchange=e=>{st.f=e.target.value;after&&after()};
  function rerenderScope(){const keep=$('details',root).open;root.outerHTML=scopeUI(id);bindScope(id,after);if(keep)$('#sc-'+id+' details').open=true;after&&after()}
}
function scopeCards(id){
  const st=SC[id]||{g:new Set(),s:new Set(),f:'all'};
  return CARDS.filter(c=>{
    if(st.s.size&&!st.s.has(c.s))return false;
    if(!st.s.size&&st.g.size&&!st.g.has(grpOf(c)))return false;
    const r=S.srs[c.id];
    switch(st.f){case'due':return isDue(c.id);case'new':return !r;case'unknown':return !isKnown(c.id);
      case'weak':return r&&r.wrong>0&&r.box<3;case'star':return !!S.star[c.id];case'known':return isKnown(c.id)}
    return true;
  });
}

const mainEn=c=>c.en;
function startExam(cs,type,mode){
  const all=CARDS.filter(c=>c.k!=='c');
  const qs=cs.map(c=>{
    let t=type==='mix'?['ar-en','en-ar','write','tf'][Math.floor(Math.random()*4)]:type;
    const sameKind=all.filter(x=>x.k===c.k&&x.id!==c.id),sameGrp=sameKind.filter(x=>x.s===c.s);
    const pick=(txt)=>{const seen=new Set([txt(c)]),out=[];for(const x of shuffle(sameGrp).concat(shuffle(sameKind),shuffle(all))){const v=txt(x);if(!seen.has(v)){seen.add(v);out.push(x);if(out.length>=3)break}}return out};
    const q={id:c.id,t};
    if(t==='ar-en'){const o=shuffle([c].concat(pick(mainEn)));q.opts=o.map(x=>mainEn(x));q.ok=o.indexOf(c)}
    else if(t==='en-ar'){const o=shuffle([c].concat(pick(arMain)));q.opts=o.map(x=>arMain(x));q.ok=o.indexOf(c)}
    else if(t==='tf'){const truth=Math.random()<.5,w=pick(mainEn)[0];q.shown=truth?c:w;q.ok=truth?1:0;q.opts=['False','True']}
    return q});
  E={run:true,qs,i:0,ans:[],mode,type,t0:Date.now()};qShow();
}
function norm(s){return s.toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-z0-9;,/ ]/g,'').replace(/\bto\b/g,' ').replace(/\s+/g,' ').trim()}
function writeOk(typed,c){
  const t=norm(typed);if(t.length<2)return false;
  return norm(c.en).split(/[;,/]/).map(x=>x.trim()).filter(Boolean).some(x=>x===t||(t.length>=4&&(x.includes(t)||t.includes(x)))) ;
}

  else{body=`<div class="q-ar ar">${esc(arMain(c))}</div><p class="mute" style="text-align:center">Type the English meaning</p><input type="text" id="w-in" autocomplete="off" autocapitalize="off" placeholder="e.g. king" style="font-size:20px;text-align:center"><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="w-ok">Check</button><button class="btn ghost" id="w-skip">I don't know</button></div>`}

   <div class="card" style="max-width:640px;margin:12px auto">${body}<div id="fb"></div></div>`;
  $('#x-quit').onclick=()=>{if(confirm('End the exam now? Unanswered questions count as wrong.')){while(E.ans.length<E.qs.length)E.ans.push({v:null,r:false});E.i=E.qs.length;qShow()}};

  setClean(()=>{kbd=null});
}

   <div class="tiles" style="margin-top:10px">${M.tiles.map((t,i)=>`<button class="tile ${t.s==='ar'?'ar':''} ${t.done?'done':''}" data-i="${i}">${esc(t.t)}</button>`).join('')}</div></div>`;
  const tm=setInterval(()=>{const e=$('#m-t');if(!e||!M)return clearInterval(tm);e.textContent=Math.round((Date.now()-M.t0)/1000)},500);
  $$('.tile').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,t=M.tiles[i];if(t.done)return;
    if(M.sel===null){M.sel=i;b.classList.add('sel');return}
    if(M.sel===i){M.sel=null;b.classList.remove('sel');return}
    const a=M.tiles[M.sel],ab=$(`.tile[data-i="${M.sel}"]`);
    if(a.s===t.s){ab.classList.remove('sel');M.sel=i;b.classList.add('sel');return}
    if(a.id===t.id){a.done=t.done=true;ab.classList.add('done');b.classList.add('done');M.left--;M.sel=null;$('#m-left').textContent=M.left;
      if(!M.left){clearInterval(tm);const secs_=Math.round((Date.now()-M.t0)/1000),k='n'+M.n,pb=S.best[k];if(!pb||secs_<pb)S.best[k]=secs_;touchDay();save();
        $('#mboard').innerHTML=`<div class="card" style="text-align:center"><h2>Cleared! 🎉</h2><p>${secs_}s with ${M.miss} miss${M.miss===1?'':'es'}.<br><span class="mute small">Best for ${M.n} pairs: ${S.best[k]}s</span></p><button class="btn" id="m-again">Play again</button></div>`;$('#m-again').onclick=()=>$('#m-go').click();M=null}}
    else{M.miss++;$('#m-miss').textContent=M.miss;[ab,b].forEach(x=>x.classList.add('no'));M.sel=null;setTimeout(()=>[ab,b].forEach(x=>x&&x.classList.remove('no','sel')),500);
      const r=S.srs[a.id]||(S.srs[a.id]={box:0,due:0,wrong:0,seen:0});r.wrong++;save()}
  });
}
/* ---------- BOOK ---------- */
let bookPage=7;const NPG=46;
function book(){
  const label=p=>p<=6?'Front matter':p<=14&&p>=7&&p<=14&&false?'':p>=8?`Book page ${p-7}`:'Introduction';
  $('#app').innerHTML=`<div class="card"><div class="row"><button class="btn sm sec" id="bp">◀ Prev</button>
    <select id="bsel" style="flex:1;min-width:150px">${Array.from({length:NPG},(_,i)=>i+1).map(p=>`<option value="${p}" ${p===bookPage?'selected':''}>PDF page ${p}${p>=8?' · book p.'+(p-7):p===1?' · cover':' · intro'}</option>`).join('')}</select>
    <button class="btn sm sec" id="bn">Next ▶</button>
    <a class="btn sm" href="80-percent-of-quranic-words.pdf" download="80-percent-of-quranic-words.pdf" style="text-decoration:none;display:inline-block">⬇ Download PDF</a></div>
    <details class="scope"><summary>Jump to a list</summary><div class="secs">${DB.secs.map(s=>`<a href="#" data-p="${s.p+7}" style="display:block;padding:3px 0;color:var(--pri)">${esc(s.t)} <span class="mute small">p.${s.p}</span></a>`).join('')}</div></details></div>
   <img class="bookimg" id="bimg" alt="Book page" src="pages/p${String(bookPage).padStart(2,'0')}.jpg" onerror="this.alt='Page image not found — keep the pages folder next to index.html'">`;
  const set=p=>{bookPage=Math.max(1,Math.min(NPG,p));book()};
  $('#bp').onclick=()=>set(bookPage-1);$('#bn').onclick=()=>set(bookPage+1);$('#bsel').onchange=e=>set(+e.target.value);
  $$('[data-p]').forEach(a=>a.onclick=e=>{e.preventDefault();set(+a.dataset.p)});
  kbd=e=>{if(tab!=='book'||e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft')set(bookPage-1);if(e.key==='ArrowRight')set(bookPage+1)};
  setClean(()=>{kbd=null});
}

applyTheme();addEventListener('hashchange',render);render();
